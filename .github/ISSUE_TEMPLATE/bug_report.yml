name: Bug report
description: Report a reproducible problem in Jade.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Revision
      description: Commit SHA, branch, or release version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: iPad Pro, iPadOS 18.6
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Add logs or screenshots after removing personal data and imported content.

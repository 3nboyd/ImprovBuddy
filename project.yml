name: ImprovBuddy
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.nbz.ImprovBuddy
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Jade uses your microphone to analyze time feel and pitch.
    INFOPLIST_KEY_UIBackgroundModes: audio
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
configs:
  Debug: debug
  Release: release
packages: {}
targets:
  ImprovBuddy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ImprovBuddy
    resources:
      - path: ImprovBuddy/Resources
    settings:
      base:
        PRODUCT_NAME: ImprovBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.nbz.ImprovBuddy
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_CFBundleDisplayName: Jade
        INFOPLIST_KEY_CFBundleName: Jade
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: 15.0
        DEVELOPMENT_ASSET_PATHS: ImprovBuddy/Resources
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TEST_LAB
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
    preBuildScripts: []

  ImprovBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ImprovBuddyTests
    dependencies:
      - target: ImprovBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nbz.ImprovBuddyTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: 15.0

schemes:
  ImprovBuddy:
    build:
      targets:
        ImprovBuddy: all
        ImprovBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ImprovBuddyTests
    archive:
      config: Release
